name: AFTERMATH LIVE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install MCP server dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Run Python backend & 30-phrase tests
        run: python -m pytest backend/tests tests/test_deadline_30_phrases.py -v

      - name: Run Python shared deadline parser tests
        run: python tests/test_deadline_parser.py

      - name: Run Node.js shared deadline tests
        run: |
          node tests/test_deadline_parser.js
          node tests/test_deadline_30_phrases.js

      - name: Run MCP server & sync tests
        working-directory: mcp-server
        run: npm test
